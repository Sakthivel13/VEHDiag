<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — VEHDiag</title>
  <meta name="description" content="Create a free VEHDiag account and start diagnosing with the built-in simulator.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container">
    <nav class="nav" aria-label="Main navigation">
      <a class="nav-brand" href="/" aria-label="VEHDiag home"><img src="/branding/logo.svg" alt="VEHDiag" width="180" height="46"></a>
      <div class="nav-cta">
        <button class="btn btn-secondary btn-sm" data-theme-toggle aria-label="Switch theme"></button>
        <a class="btn btn-ghost btn-sm" href="/login.html">Log in</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section">
    <div class="container" style="max-width:440px">
      <div class="section-head" style="text-align:left;margin-inline:0">
        <span class="kicker">Free forever tier</span>
        <h1 style="font-size:1.9rem">Create your account</h1>
        <p class="lead" style="font-size:.95rem">Diagnostics, simulator, live data and reports — no credit card.</p>
      </div>
      <div class="card">
        <form id="register-form" data-validate novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input class="input" id="name" name="name" required autocomplete="name" placeholder="Priya Sharma">
            <div class="field-error">Please enter your name.</div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@workshop.dev">
            <div class="field-error">Enter a valid email address.</div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" required autocomplete="new-password" minlength="8">
            <div class="field-error">Minimum 8 characters.</div>
          </div>
          <div class="field">
            <label class="check-row"><input type="checkbox" required> <span>I agree to the <a href="/docs.html#license">terms</a> and understand VEHDiag is an independent open project.</span></label>
          </div>
          <button class="btn btn-primary" style="width:100%" type="submit"><span class="spinner"></span> Create account</button>
          <p class="hint" style="text-align:center;margin-top:1rem">Already registered? <a href="/login.html">Log in</a></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span data-year>2026</span> VEHDiag — independent project.</span>
      <span><a href="/">Home</a> · <a href="/docs.html">Docs</a> · <a href="/contact.html">Contact</a></span>
    </div>
  </div>
</footer>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
