# Metadata consumed by the Windows packaging scripts.
application:
  name: Vehicle Diagnostics Platform
  executable: VehicleDiagnosticsPlatform.exe
  version: 0.1.0
  publisher: Vehicle Diagnostics Platform Team
  identifier: "{8F3C1E42-5B7A-4D19-9C6E-2A1F7B4D8E30}"

install:
  directory: "{autopf}\\VehicleDiagnosticsPlatform"
  privileges: admin
  architectures: x64compatible

shortcuts:
  start_menu: true
  desktop: optional
  documentation: true

file_associations:
  - extension: .vdp
    description: Vehicle diagnostics project
    icon_index: 0

# Vendor libraries copied next to the executable when they are present.
optional_dlls:
  - PCANBasic.dll
  - vxlapi64.dll
  - canlib32.dll
  - icsneo40.dll

prerequisites:
  - name: Microsoft Visual C++ 2015-2022 Redistributable
    optional: false
  - name: PEAK PCAN driver
    optional: true
  - name: Vector Driver Setup
    optional: true
  - name: Kvaser drivers
    optional: true
