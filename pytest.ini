[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    unit: fast isolated unit tests
    integration: tests that wire several layers together
    ui: tests requiring a Qt event loop
    hardware: tests requiring real VCI hardware (skipped by default)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestCollectionWarning
